[project]
name = "rootsy"
version = "0.1.0"
description = "A pythonic GEDCOM file parser"
authors = [{ name = "Ester Beltrami", email = "beltrami.ester@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["attrs>=26.1.0", "rich>=15.0.0", "typer>=0.27.2"]

[project.scripts]
rootsy = "rootsy.cli:app"

[dependency-groups]
dev = ["mypy>=2.3.1", "pytest>=9.1.1", "ruff>=0.16.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rootsy"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.format]
# The README aligns the comments in its examples to read as a column; leave
# prose files to their author.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
ignore = [
    # pragma: alphabetize
    "C901", # Function too complex
    # The licence lives in LICENCE; repeating it atop all fifty files would say
    # nothing the repository does not already say.
    "CPY001", # Missing copyright notice at top of file
    "D1", # Missing docstring in {}
    "DTZ001", # `datetime.datetime()` called without a `tzinfo` argument
    "DTZ007", # Naive datetime constructed using `datetime.datetime.strptime()` without %z
    "PLR0912", # Too many branches
    "S101", # Use of `assert` detected
    "D203", # 1 blank line required before class docstring
    # D212/D213 are mutually exclusive; this codebase puts the summary on the
    # first line, which is what D212 asks for, so only D213 can be kept.
    "D213", # Multi-line docstring summary should start at the second line
    "COM812", # Missing trailing comma. Removed due to formatter redundancy.
    "ISC001",
    # single-line-implicit-string-concatenation.  Excluding due to ruff issues.

]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401", # `foo` imported but unused

]
"tests/**" = [
    # Tests assert against literal expected values; naming them would only hide
    # what the assertion says.
    "PLR2004", # Magic value used in comparison

]

[tool.mypy]
python_version = "3.14"
files = ["rootsy", "tests"]
strict = true

[project]
name = "rootsy"
version = "0.1.0"
description = "A pythonic GEDCOM file parser"
authors = [{ name = "Ester Beltrami", email = "beltrami.ester@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["attrs>=24.2.0", "rich>=13.9.4", "typer>=0.15.1"]

[project.scripts]
rootsy = "rootsy.cli:app"

[dependency-groups]
dev = ["mypy>=1.14.1,<2", "pytest>=8.3.4", "ruff>=0.8.2,<0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rootsy"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
ignore = [
    # pragma: alphabetize
    "C901", # Function too complex
    "D1", # Missing docstring in {}
    "DTZ001", # `datetime.datetime()` called without a `tzinfo` argument
    "DTZ007", # Naive datetime constructed using `datetime.datetime.strptime()` without %z
    "PLR0912", # Too many branches
    "S101", # Use of `assert` detected
    "D203", # 1 blank line required before class docstring
    # D212/D213 are mutually exclusive; this codebase puts the summary on the
    # first line, which is what D212 asks for, so only D213 can be kept.
    "D213", # Multi-line docstring summary should start at the second line
    "COM812", # Missing trailing comma. Removed due to formatter redundancy.
    "ISC001",
    # single-line-implicit-string-concatenation.  Excluding due to ruff issues.

]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401", # `foo` imported but unused

]
"tests/**" = [
    # Tests assert against literal expected values; naming them would only hide
    # what the assertion says.
    "PLR2004", # Magic value used in comparison

]

[tool.mypy]
python_version = "3.13"
files = ["rootsy", "tests"]
strict = true
